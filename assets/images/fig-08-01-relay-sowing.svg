<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">図8-1 relay sowingの流れ</title>
  <desc id="desc">蒔きの最後のketeが占有穴に入り、その時点で捕獲や停止条件がなければ、その穴の全keteを取り上げ、同じ方向へ蒔きを続ける。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="960" height="430" fill="#fff"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700">relay sowing: 占有穴から蒔きを続ける</text>
  <g font-family="sans-serif" text-anchor="middle"><text x="150" y="88" font-size="18" font-weight="700">1. 最後の1個を置く</text><text x="480" y="88" font-size="18" font-weight="700">2. 穴の全keteを取る</text><text x="810" y="88" font-size="18" font-weight="700">3. 同じ方向へ続ける</text></g>
  <g transform="translate(70 185)" fill="#fff" stroke="#6b7280" stroke-width="3"><circle cx="0" r="42"/><circle cx="85" r="42"/><circle cx="170" r="42"/></g>
  <g font-family="sans-serif" font-size="24" text-anchor="middle"><text x="70" y="193">1</text><text x="155" y="193">2</text><text x="240" y="193">0</text></g>
  <path d="M210 120 C205 145,185 155,163 160" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(395 185)" fill="#fff" stroke="#6b7280" stroke-width="3"><circle cx="0" r="42"/><circle cx="85" r="42"/><circle cx="170" r="42"/></g>
  <g font-family="sans-serif" font-size="24" text-anchor="middle"><text x="395" y="193">1</text><text x="480" y="193">0</text><text x="565" y="193">0</text></g>
  <g fill="#ea580c"><circle cx="450" cy="285" r="9"/><circle cx="480" cy="285" r="9"/><circle cx="510" cy="285" r="9"/></g>
  <g transform="translate(720 185)" fill="#fff" stroke="#6b7280" stroke-width="3"><circle cx="0" r="42"/><circle cx="85" r="42"/><circle cx="170" r="42"/></g>
  <g font-family="sans-serif" font-size="24" text-anchor="middle"><text x="720" y="193">1</text><text x="805" y="193">1</text><text x="890" y="193">1</text></g>
  <line x1="270" y1="185" x2="335" y2="185" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/><line x1="595" y1="185" x2="660" y2="185" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="395" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b5563">例では2個あった穴へ最後の1個が入り、合計3個を取り上げている。</text>
</svg>
